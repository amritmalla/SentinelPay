spring:
  application:
    name: risk-service
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
  datasource:
    url: ${RISK_DB_URL:jdbc:postgresql://localhost:5435/sentinelpay_risk}
    username: ${RISK_DB_USER:sentinelpay}
    password: ${RISK_DB_PASSWORD:sentinelpay_secret}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      acks: all
      properties:
        enable.idempotence: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE:1.0}

sentinelpay:
  security:
    gateway-secret: ${GATEWAY_SHARED_SECRET:change-me-gateway-secret}
  risk:
    grpc:
      port: ${RISK_GRPC_PORT:9091}
    # rules (default / tests) | ml (compose/demo)
    scorer: ${RISK_SCORER:rules}
    model:
      base-url: ${MODEL_HTTP_BASE_URL:http://localhost:8090}
      connect-timeout-ms: ${MODEL_CONNECT_TIMEOUT_MS:100}
      read-timeout-ms: ${MODEL_READ_TIMEOUT_MS:200}
    scoring:
      block-threshold: ${RISK_BLOCK_THRESHOLD:0.70}
      review-threshold: ${RISK_REVIEW_THRESHOLD:0.30}
      high-alert-threshold: ${RISK_HIGH_ALERT_THRESHOLD:0.90}
  outbox:
    relay:
      fixed-delay-ms: ${OUTBOX_RELAY_DELAY_MS:500}
      batch-size: ${OUTBOX_RELAY_BATCH_SIZE:50}
    purge:
      cron: ${OUTBOX_PURGE_CRON:0 0 3 * * *}
