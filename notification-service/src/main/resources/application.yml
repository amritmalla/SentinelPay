spring:
  application:
    name: notification-service
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5437/sentinelpay_notifications}
    username: ${NOTIFICATION_DB_USER:sentinelpay}
    password: ${NOTIFICATION_DB_PASSWORD:sentinelpay_secret}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    template:
      observation-enabled: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:notification-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      observation-enabled: true
      ack-mode: manual
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE:1.0}

sentinelpay:
  notification:
    from: ${NOTIFICATION_FROM:no-reply@sentinelpay.local}
  kafka:
    dlt:
      retries: ${KAFKA_DLT_RETRIES:3}
      backoff-ms: ${KAFKA_DLT_BACKOFF_MS:1000}
