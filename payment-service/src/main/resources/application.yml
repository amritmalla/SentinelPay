spring:
  application:
    name: payment-service
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5434/sentinelpay_payments}
    username: ${PAYMENT_DB_USER:sentinelpay}
    password: ${PAYMENT_DB_PASSWORD:sentinelpay_secret}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      acks: all
      properties:
        enable.idempotence: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE:1.0}

sentinelpay:
  merchants:
    # Server-sourced merchant country for risk scoring (not client-attested).
    default-country: ${MERCHANT_DEFAULT_COUNTRY:US}
    countries: {}
    routing-rules:
      merchants: {}
  risk:
    grpc:
      # 100 ms deadline per call; GrpcRiskEvaluator retries once on UNAVAILABLE/DEADLINE_EXCEEDED (~200 ms worst case).
      target: ${RISK_GRPC_TARGET:localhost:9091}
      deadline-ms: ${RISK_GRPC_DEADLINE_MS:100}
    http:
      base-url: ${RISK_HTTP_BASE_URL:http://localhost:8083}
  outbox:
    relay:
      fixed-delay-ms: ${OUTBOX_RELAY_DELAY_MS:500}
      batch-size: ${OUTBOX_RELAY_BATCH_SIZE:50}
    purge:
      cron: ${OUTBOX_PURGE_CRON:0 0 3 * * *}
  reconciliation:
    sweep:
      delay-ms: ${RECONCILIATION_SWEEP_DELAY_MS:30000}
      cutoff-seconds: ${RECONCILIATION_SWEEP_CUTOFF_SECONDS:30}
  providers:
    stripe:
      mode: ${STRIPE_MODE:stub}
      api-key: ${STRIPE_API_KEY:sk_test_placeholder}
      base-url: ${STRIPE_BASE_URL:https://api.stripe.com}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_test_placeholder}
      # Test-mode payment instrument. The charge API carries no payment method (PCI scope stays
      # out of the platform), so mode=real confirms against this. Production would take a
      # merchant-supplied payment-method token on the charge request instead.
      payment-method: ${STRIPE_PAYMENT_METHOD:pm_card_visa}
  routing:
    enabled: true
    policy: ${ROUTING_POLICY:scored}
    health-window-minutes: 5
    latency-ceiling-ms: 2000
    latency-ewma-alpha: 0.3
    scored:
      weight-success: 0.7
      weight-latency: 0.3
      cost-tiebreak-epsilon: 0.05
    bandit:
      decay-half-life-minutes: 30
      cost-weight: 0.1
    breaker:
      enabled: ${ROUTING_BREAKER_ENABLED:false}
      sliding-window-size: 20
      failure-rate-threshold: 50
      wait-duration-open-ms: 30000
      permitted-calls-half-open: 3
      minimum-number-of-calls: 10
    split: {}
    providers:
      mockpay:
        enabled: true
        fee-bps: 150
        fee-fixed-cents: 10
        currencies: [USD]
      stripe:
        enabled: true
        fee-bps: 290
        fee-fixed-cents: 30
        currencies: [USD]
  security:
    gateway-secret: ${GATEWAY_SHARED_SECRET:change-me-gateway-secret}
