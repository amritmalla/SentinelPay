spring:
  application:
    name: payment-service
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5434/sentinelpay_payments}
    username: ${PAYMENT_DB_USER:sentinelpay}
    password: ${PAYMENT_DB_PASSWORD:sentinelpay_secret}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE:1.0}

sentinelpay:
  risk:
    grpc:
      # 100 ms deadline per call; GrpcRiskEvaluator retries once on UNAVAILABLE/DEADLINE_EXCEEDED (~200 ms worst case).
      target: ${RISK_GRPC_TARGET:localhost:9091}
      deadline-ms: ${RISK_GRPC_DEADLINE_MS:100}
  outbox:
    relay:
      fixed-delay-ms: ${OUTBOX_RELAY_DELAY_MS:500}
      batch-size: ${OUTBOX_RELAY_BATCH_SIZE:50}
    purge:
      cron: ${OUTBOX_PURGE_CRON:0 0 3 * * *}
  reconciliation:
    sweep:
      delay-ms: ${RECONCILIATION_SWEEP_DELAY_MS:30000}
      cutoff-seconds: ${RECONCILIATION_SWEEP_CUTOFF_SECONDS:30}
