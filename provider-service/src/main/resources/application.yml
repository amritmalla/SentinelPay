spring:
  application:
    name: provider-service
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
  datasource:
    url: ${PROVIDER_DB_URL:jdbc:postgresql://localhost:5436/sentinelpay_provider}
    username: ${PROVIDER_DB_USER:sentinelpay}
    password: ${PROVIDER_DB_PASSWORD:sentinelpay_secret}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE:1.0}
