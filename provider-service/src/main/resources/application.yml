spring:
  application:
    name: provider-service
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
  datasource:
    url: ${PROVIDER_DB_URL:jdbc:postgresql://localhost:5436/sentinelpay_provider}
    username: ${PROVIDER_DB_USER:sentinelpay}
    password: ${PROVIDER_DB_PASSWORD:sentinelpay_secret}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE:1.0}

sentinelpay:
  security:
    gateway-secret: ${GATEWAY_SHARED_SECRET:change-me-gateway-secret}
  outbox:
    relay:
      fixed-delay-ms: ${OUTBOX_RELAY_DELAY_MS:500}
      batch-size: ${OUTBOX_RELAY_BATCH_SIZE:50}
    purge:
      cron: ${OUTBOX_PURGE_CRON:0 0 3 * * *}
