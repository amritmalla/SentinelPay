[project]
name = "riskmodel"
version = "1.0.0"
description = "SentinelPay synthetic fraud scoring model (portfolio ML lifecycle)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "lightgbm>=4.5.0",
  "scikit-learn>=1.5.0",
  "shap>=0.46.0",
  "numba>=0.60.0",
  "llvmlite>=0.43.0",
  "numpy>=2.0.0",
  "pandas>=2.2.0",
  "pyarrow>=17.0.0",
  "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "httpx>=0.27.0",
  "pandas-stubs>=2.2.0",
  "types-requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riskmodel"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["riskmodel"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["lightgbm.*", "shap.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
