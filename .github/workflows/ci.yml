name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Lower Docker daemon minimum API version for Testcontainers
        # Docker Engine 28+ on the runner enforces a minimum API version of 1.40 and
        # rejects the API 1.32 that Testcontainers' docker-java client negotiates on the
        # unix socket ("client version 1.32 is too old"). The client can't be moved off
        # 1.32 (DOCKER_API_VERSION is ignored on this path), so use Docker's supported
        # escape hatch: lower the daemon's minimum back to 1.24 and restart it.
        run: |
          sudo mkdir -p /etc/systemd/system/docker.service.d
          printf '[Service]\nEnvironment="DOCKER_MIN_API_VERSION=1.24"\n' \
            | sudo tee /etc/systemd/system/docker.service.d/min-api-version.conf
          sudo systemctl daemon-reload
          sudo systemctl restart docker
          docker version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build & verify (full Testcontainers suite = the correctness gate)
        run: ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/*-reports/*.xml'
          if-no-files-found: ignore
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: '**/target/site/jacoco/**'
          if-no-files-found: ignore

  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npx --yes @redocly/cli@latest lint docs/architecture/contracts/openapi.yaml

  risk-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync, lint, type-check, test, train smoke
        working-directory: risk-model
        run: |
          uv sync --extra dev
          uv run ruff check src tests
          uv run mypy
          uv run pytest
          uv run python -m riskmodel.train --smoke --seed 1

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install, lint, typecheck, test, build
        working-directory: dashboard
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
