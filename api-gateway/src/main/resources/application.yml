spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: payments
          uri: ${PAYMENT_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/payments/**
        - id: reconciliation-runs
          uri: ${PAYMENT_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/reconciliation-runs/**
        - id: webhooks
          uri: ${PAYMENT_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/webhooks/**
        - id: fraud-assessments
          uri: ${RISK_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/fraud-assessments/**
        - id: providers
          uri: ${PROVIDER_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/providers/**
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACE_SAMPLE:1.0}
